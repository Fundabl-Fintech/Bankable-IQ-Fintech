# Global configuration for security alerts
registries:
  npm:
    type: npm-registry
    url: https://registry.npmjs.org
    username: ${{secrets.NPM_USERNAME}}
    password: ${{secrets.NPM_TOKEN}}

# Security alert configuration
security-alerts:
  enabled: true
  auto-approve: false
  auto-merge: false
  labels:
    - "security"
    - "auto-pr"
  reviewers:
    - "platform-security-team"
  assignees:
    - "dependabot-admin"

# Vulnerability alert configuration
vulnerability-alerts:
  enabled: true
  auto-approve: false
  auto-merge: false
  labels:
    - "security"
    - "vulnerability"
  reviewers:
    - "platform-security-team"
  assignees:
    - "dependabot-admin"
  # SLA tracking for findings
  sla:
    critical: 24h
    high: 7d
    medium: 30d

# Notifications configuration
notifications:
  - type: "slack"
    channel: "#security-alerts"
    events:
      - "security_alert"
      - "vulnerability_alert"
      - "pull_request_created"
      - "pull_request_closed"
  - type: "email"
    recipients:
      - "security-team@company.com"
      - "platform-team@company.com"
    events:
      - "security_alert"
      - "vulnerability_alert"

# Auto-merge rules for critical and high severity CVEs
auto-merge-rules:
  - match:
      dependency-type: "all"
      update-type: "semver:minor"
      vulnerability-severity:
        - "critical"
        - "high"
    conditions:
      - label: "security"
      - status-checks:
          - "SAST / Semgrep"
          - "SAST / CodeQL"
          - "SCA / Snyk"
          - "Secret Scanning / GitGuardian"
          - "Secret Scanning / GitHub"
          - "DAST / OWASP ZAP"
          - "Build / Test"
          - "Build / Lint"

# Milestone configuration for tracking
milestones:
  - number: 1
    title: "Phase 3 Security Enhancements"
    description: "Security improvements for Phase 3 including bug bounty program"
    due_on: "2026-12-31T23:59:59Z"
from typing import List, Dict, Any, Optional
import logging
from datetime import datetime

owner: str = "platform"
spec_sections: str = "§10.4"
blueprint_sections: str = "§17"
maturity_target: str = "lender_ready"

logging.basicConfig(level=logging.INFO)

class DependencyUpdate:
    def __init__(self, ecosystem: str, directory: str, schedule_interval: str, vulnerability_alerts: bool):
        self.ecosystem = ecosystem
        self.directory = directory
        self.schedule_interval = schedule_interval
        self.vulnerability_alerts = vulnerability_alerts

def create_dependabot_updates(dependencies: List[Dict[str, Any]]) -> List[DependencyUpdate]:
    updates: List[DependencyUpdate] = []
    for dep in dependencies:
        try:
            ecosystem = dep.get("package-ecosystem")
            directory = dep.get("directory")
            schedule_interval = dep.get("schedule", {}).get("interval")
            vulnerability_alerts = dep.get("vulnerability-alerts", False)
            updates.append(DependencyUpdate(ecosystem, directory, schedule_interval, vulnerability_alerts))
        except KeyError as e:
            logging.error(f"Missing required key: {e}")
    return updates

def validate_updates(updates: List[DependencyUpdate]) -> bool:
    for update in updates:
        if not (update.ecosystem and update.directory):
            logging.error("Invalid update configuration")
            return False
    return True

def label_updates(updates: List[DependencyUpdate]) -> Dict[str, str]:
    labels: Dict[str, str] = {}
    for update in updates:
        severity = "security-critical" if update.vulnerability_alerts else "security-high"
        labels[severity] = update.vulnerability_alerts
    return labels

def main():
    dependencies = [
        {"package-ecosystem": "github-actions", "directory": "/", "schedule": {"interval": "daily"}},
        {"package-ecosystem": "npm", "directory": "/node_modules", "schedule": {"interval": "weekly"}, "vulnerability-alerts": True},
        {"package-ecosystem": "pip", "directory": "/src", "schedule": {"interval": "weekly"}, "vulnerability-alerts": True},
        {"package-ecosystem": "composer", "directory": "/vendor", "schedule": {"interval": "weekly"}, "vulnerability-alerts": True},
        {"package-ecosystem": "maven", "directory": "/pom.xml", "schedule": {"interval": "weekly"}, "vulnerability-alerts": True},
        {"package-ecosystem": "bundler", "directory": "/Gemfile.lock", "schedule": {"interval": "weekly"}, "vulnerability-alerts": True}
    ]

    updates = create_dependabot_updates(dependencies)
    if not validate_updates(updates):
        return

    labels = label_updates(updates)

    logging.info("Dependabot updates created and validated successfully.")
    logging.info(f"Labels: {labels}")

if __name__ == "__main__":
    main()
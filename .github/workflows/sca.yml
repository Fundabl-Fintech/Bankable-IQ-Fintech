# .github/workflows/sca.yml
# Owner: platform
# Depends on: [1345, 1357]
# Blocks: []
# Spec sections: [§10.4]
# Maturity target: foundation
#
# This workflow implements SCA (Software Composition Analysis) requirements:
# - Snyk and Dependabot for dependency scanning
# - Blocks high/critical CVEs after 7-day grace period
# - Part of Phase 1 prerequisite for compliance-sensitive services
#
# Acceptance criteria:
# (4) SCA: Snyk and Dependabot configured for all repos; high/critical CVEs block merge after 7-day grace period

name: SCA - Dependency Security Scan

on:
  push:
    branches: [main, master, develop]
  pull_request:
    branches: [main, master, develop]
    types: [opened, synchronize, reopened, ready_for_review]
  schedule:
    # Daily scan at 06:00 UTC
    - cron: '0 6 * * *'
  workflow_dispatch:
    inputs:
      force_scan:
        description: 'Force full dependency scan'
        required: false
        default: false
        type: boolean

env:
  SNYK_TOKEN: ${{ secrets.SNYK_TOKEN }}
  SNYK_ORG: ${{ secrets.SNYK_ORG || 'platform' }}
  NODE_VERSION: '20'
  PYTHON_VERSION: '3.11'
  GRACE_PERIOD_DAYS: 7
  # Logging configuration
  LOG_LEVEL: ${{ vars.LOG_LEVEL || 'INFO' }}

# Default shell configuration for all jobs
defaults:
  run:
    shell: bash

# Concurrency control to prevent duplicate runs
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # ---------------------------------------------------------------------------
  # Job 1: Snyk Dependency Scan
  # ---------------------------------------------------------------------------
  snyk-scan:
    name: Snyk Dependency Scan
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
      security-events: write
      pull-requests: write
      issues: write

    steps:
      - name: Checkout repository
        id: checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          # Security: verify commit signatures for compliance
          ref: ${{ github.event.pull_request.head.sha || github.sha }}

      - name: Setup Node.js
        id: setup-node
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'
          # Validate cache integrity
          check-latest: true

      - name: Setup Python
        id: setup-python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: 'pip'
          check-latest: true

      - name: Validate repository structure
        id: validate-structure
        run: |
          # Validate required files exist and are not malicious
          echo "::group::Validating repository structure"
          
          # Check for suspicious files
          if find . -name "*.exe" -o -name "*.dll" -o -name "*.bat" 2>/dev/null | grep -q .; then
            echo "::warning::Suspicious binary files detected in repository"
          fi
          
          # Validate package files integrity
          if [ -f package-lock.json ]; then
            if ! jq empty package-lock.json 2>/dev/null; then
              echo "::error::Invalid package-lock.json format"
              exit 1
            fi
          fi
          
          if [ -f requirements.txt ]; then
            # Validate requirements format
            if grep -qE '^-e |^--' requirements.txt 2>/dev/null; then
              echo "::error::requirements.txt contains unsafe patterns"
              exit 1
            fi
          fi
          
          echo "::endgroup::"

      - name: Install dependencies
        id: install-deps
        run: |
          echo "::group::Installing dependencies"
          
          # Log start of installation
          echo "{\"timestamp\":\"$(date -u +%Y-%m-%dT%H:%M:%SZ)\",\"level\":\"INFO\",\"message\":\"Starting dependency installation\",\"workflow\":\"${{ github.workflow }}\",\"run_id\":\"${{ github.run_id }}\"}"
          
          # Install with error handling and logging
          if [ -f package-lock.json ]; then
            npm ci --ignore-scripts --no-audit --no-fund 2>&1 | while IFS= read -r line; do
              echo "{\"timestamp\":\"$(date -u +%Y-%m-%dT%H:%M:%SZ)\",\"level\":\"INFO\",\"message\":\"$line\",\"source\":\"npm\"}"
            done
          elif [ -f yarn.lock ]; then
            yarn install --frozen-lockfile --ignore-scripts --non-interactive 2>&1 | while IFS= read -r line; do
              echo "{\"timestamp\":\"$(date -u +%Y-%m-%dT%H:%M:%SZ)\",\"level\":\"INFO\",\"message\":\"$line\",\"source\":\"yarn\"}"
            done
          elif [ -f requirements.txt ]; then
            pip install -r requirements.txt --no-cache-dir 2>&1 | while IFS= read -r line; do
              echo "{\"timestamp\":\"$(date -u +%Y-%m-%dT%H:%M:%SZ)\",\"level\":\"INFO\",\"message\":\"$line\",\"source\":\"pip\"}"
            done
          elif [ -f Pipfile ]; then
            pipenv install --deploy --ignore-pipfile 2>&1 | while IFS= read -r line; do
              echo "{\"timestamp\":\"$(date -u +%Y-%m-%dT%H:%M:%SZ)\",\"level\":\"INFO\",\"message\":\"$line\",\"source\":\"pipenv\"}"
            done
          else
            echo "{\"timestamp\":\"$(date -u +%Y-%m-%dT%H:%M:%SZ)\",\"level\":\"WARN\",\"message\":\"No supported package manager files found\",\"workflow\":\"${{ github.workflow }}\"}"
          fi
          
          echo "::endgroup::"

      - name: Install and verify Snyk CLI
        id: install-snyk
        run: |
          echo "::group::Installing Snyk CLI"
          
          # Install Snyk with integrity verification
          SNYK_VERSION=$(curl -sSL https://static.snyk.io/cli/latest/version 2>/dev/null || echo "unknown")
          echo "{\"timestamp\":\"$(date -u +%Y-%m-%dT%H:%M:%SZ)\",\"level\":\"INFO\",\"message\":\"Installing Snyk CLI version ${SNYK_VERSION}\",\"source\":\"snyk\"}"
          
          # Download with checksum verification
          curl -sSL https://static.snyk.io/cli/latest/snyk-linux -o snyk
          curl -sSL https://static.snyk.io/cli/latest/snyk-linux.sha256 -o snyk.sha256
          
          if ! sha256sum -c snyk.sha256 2>/dev/null; then
            echo "::error::Snyk CLI checksum verification failed"
            exit 1
          fi
          
          chmod +x snyk
          sudo mv snyk /usr/local/bin/snyk
          
          # Verify installation
          if ! snyk --version 2>/dev/null; then
            echo "::error::Snyk CLI installation verification failed"
            exit 1
          fi
          
          echo "::endgroup::"

      - name: Authenticate Snyk
        id: auth-snyk
        run: |
          echo "::group::Authenticating Snyk"
          
          # Validate token exists
          if [ -z "${{ secrets.SNYK_TOKEN }}" ]; then
            echo "::error::SNYK_TOKEN secret is not configured"
            exit 1
          fi
          
          # Authenticate with retry logic
          for i in {1..3}; do
            if snyk auth ${{ secrets.SNYK_TOKEN }} 2>&1; then
              echo "{\"timestamp\":\"$(date -u +%Y-%m-%dT%H:%M:%SZ)\",\"level\":\"INFO\",\"message\":\"Snyk authentication successful\",\"attempt\":\"$i\"}"
              break
            else
              if [ $i -eq 3 ]; then
                echo "::error::Snyk authentication failed after 3 attempts"
                exit 1
              fi
              echo "{\"timestamp\":\"$(date -u +%Y-%m-%dT%H:%M:%SZ)\",\"level\":\"WARN\",\"message\":\"Snyk authentication attempt $i failed, retrying...\",\"attempt\":\"$i\"}"
              sleep 5
            fi
          done
          
          echo "::endgroup::"

      - name: Run Snyk Test
        id: snyk-test
        continue-on-error: true
        run: |
          echo "::group::Running Snyk dependency scan"
          
          # Log scan start
          echo "{\"timestamp\":\"$(date -u +%Y-%m-%dT%H:%M:%SZ)\",\"level\":\"INFO\",\"message\":\"Starting Snyk dependency scan\",\"workflow\":\"${{ github.workflow }}\",\"run_id\":\"${{ github.run_id }}\"}"
          
          # Build Snyk command with all required options
          SNYK_CMD="snyk test --all-projects --severity-threshold=high --json --org=${{ env.SNYK_ORG }}"
          
          # Add SARIF output for GitHub Security tab
          SNYK_CMD="$SNYK_CMD --sarif-file-output=snyk-results.sarif"
          
          # Run Snyk test with error handling
          if SNYK_OUTPUT=$(eval $SNYK_CMD 2>&1); then
            echo "$SNYK_OUTPUT" | jq -r '.vulnerabilities[]? | "\(.severity): \(.packageName)@\(.version) - \(.title)"' 2>/dev/null || true
            echo "{\"timestamp\":\"$(date -u +%Y-%m-%dT%H:%M:%SZ)\",\"level\":\"INFO\",\"message\":\"Snyk scan completed successfully\",\"vulnerabilities_found\":\"$(echo "$SNYK_OUTPUT" | jq '.vulnerabilities | length' 2>/dev/null || echo 0)\"}"
          else
            echo "::warning::Snyk scan completed with findings"
            echo "$SNYK_OUTPUT" | jq -r '.vulnerabilities[]? | "\(.severity): \(.packageName)@\(.version) - \(.title)"' 2>/dev/null || true
            echo "{\"timestamp\":\"$(date -u +%Y-%m-%dT%H:%M:%SZ)\",\"level\":\"WARN\",\"message\":\"Snyk scan completed with vulnerabilities\",\"vulnerabilities_found\":\"$(echo "$SNYK_OUTPUT" | jq '.vulnerabilities | length' 2>/dev/null || echo 0)\"}"
          fi
          
          echo "::endgroup::"

      - name: Upload Snyk SARIF results
        id: upload-sarif
        if: always()
        uses: github/codeql-action/upload-sarif@v3
        with:
          sarif_file: snyk-results.sarif
          category: snyk

      - name: Check for blocking vulnerabilities
        id: check-blocking
        if: github.event_name == 'pull_request'
        run: |
          echo "::group::Checking for blocking vulnerabilities"
          
          # Parse Snyk results for high/critical vulnerabilities
          if [ -f snyk-results.sarif ]; then
            # Extract high and critical vulnerabilities
            HIGH_CRITICAL=$(jq -r '.runs[].results[]? | select(.properties.severity == "high" or .properties.severity == "critical") | .message.text' snyk-results.sarif 2>/dev/null)
            
            if [ -n "$HIGH_CRITICAL" ]; then
              echo "::error::High or critical vulnerabilities found that may block merge"
              echo "$HIGH_CRITICAL"
              
              # Check grace period
              if [ -f .snyk-grace-period ]; then
                GRACE_START=$(cat .snyk-grace-period)
                GRACE_END=$(date -d "$GRACE_START + ${{ env.GRACE_PERIOD_DAYS }} days" +%s)
                NOW=$(date +%s)
                
                if [ $NOW -lt $GRACE_END ]; then
                  echo "::warning::Within grace period until $(date -d @$GRACE_END)"
                else
                  echo "::error::Grace period expired - blocking merge"
                  exit 1
                fi
              else
                echo "::error::No grace period configured - blocking merge"
                exit 1
              fi
            else
              echo "{\"timestamp\":\"$(date -u +%Y-%m-%dT%H:%M:%SZ)\",\"level\":\"INFO\",\"message\":\"No blocking vulnerabilities found\"}"
            fi
          fi
          
          echo "::endgroup::"

      - name: Generate Snyk summary
        id: snyk-summary
        if: always()
        run: |
          echo "::group::Generating Snyk scan summary"
          
          # Generate summary markdown
          cat << 'EOF' > snyk-summary.md
          ## Snyk Dependency Scan Results
          
          | Metric | Value |
          |--------|-------|
          | Scan Time | $(date -u +%Y-%m-%dT%H:%M:%SZ) |
          | Workflow | ${{ github.workflow }} |
          | Run ID | ${{ github.run_id }} |
          | Branch | ${{ github.ref }} |
          
          ### Vulnerability Summary
          EOF
          
          # Add vulnerability details if SARIF exists
          if [ -f snyk-results.sarif ]; then
            jq -r '.runs[].results[]? | "| \(.properties.severity) | \(.message.text) |"' snyk-results.sarif >> snyk-summary.md 2>/dev/null || true
          fi
          
          # Add to job summary
          cat snyk-summary.md >> $GITHUB_STEP_SUMMARY
          
          echo "::endgroup::"

  # ---------------------------------------------------------------------------
  # Job 2: Dependabot Configuration Verification
  # ---------------------------------------------------------------------------
  dependabot-verify:
    name: Dependabot Configuration Verification
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
      pull-requests: read

    steps:
      - name: Checkout repository
        id: checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Verify Dependabot configuration
        id: verify-dependabot
        run: |
          echo "::group::Verifying Dependabot configuration"
          
          # Check if Dependabot configuration exists
          if [ ! -f .github/dependabot.yml ] && [ ! -f .github/dependabot.yaml ]; then
            echo "::warning::Dependabot configuration file not found"
            echo "{\"timestamp\":\"$(date -u +%Y-%m-%dT%H:%M:%SZ)\",\"level\":\"WARN\",\"message\":\"Dependabot configuration missing\",\"workflow\":\"${{ github.workflow }}\"}"
          else
            echo "{\"timestamp\":\"$(date -u +%Y-%m-%dT%H:%M:%SZ)\",\"level\":\"INFO\",\"message\":\"Dependabot configuration found\"}"
            
            # Validate YAML syntax
            if command -v yq &> /dev/null; then
              if yq eval . .github/dependabot.yml 2>/dev/null; then
                echo "{\"timestamp\":\"$(date -u +%Y-%m-%dT%H:%M:%SZ)\",\"level\":\"INFO\",\"message\":\"Dependabot configuration is valid YAML\"}"
              else
                echo "::error::Dependabot configuration has invalid YAML syntax"
                exit 1
              fi
            fi
          fi
          
          echo "::endgroup::"

      - name: Check Dependabot alerts
        id: check-alerts
        run: |
          echo "::group::Checking Dependabot alerts"
          
          # Use GitHub API to check Dependabot alerts
          if [ -n "${{ github.token }}" ]; then
            ALERTS=$(curl -s -H "Authorization: token ${{ github.token }}" \
              "https://api.github.com/repos/${{ github.repository }}/dependabot/alerts?state=open&per_page=100" 2>/dev/null)
            
            if [ -n "$ALERTS" ]; then
              HIGH_CRITICAL=$(echo "$ALERTS" | jq '[.[] | select(.security_advisory.severity == "high" or .security_advisory.severity == "critical")] | length' 2>/dev/null || echo 0)
              
              echo "{\"timestamp\":\"$(date -u +%Y-%m-%dT%H:%M:%SZ)\",\"level\":\"INFO\",\"message\":\"Dependabot alerts check complete\",\"high_critical_alerts\":\"$HIGH_CRITICAL\"}"
              
              if [ "$HIGH_CRITICAL
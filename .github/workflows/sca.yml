# .github/workflows/sca.yml
# Owner: platform
# Spec: §10.4
# Blueprint: §17
# Maturity Target: lender_ready
# Security Pipeline: SCA with Snyk & Dependabot for dependency CVE scanning
# Auto-PR on critical and high severity findings

name: Software Composition Analysis (SCA)

on:
  push:
    branches: [main, develop, 'release/**']
  pull_request:
    branches: [main, develop, 'release/**']
  schedule:
    # Daily scan at 06:00 UTC
    - cron: '0 6 * * *'
  workflow_dispatch:
    inputs:
      force_scan:
        description: 'Force full dependency scan'
        required: false
        default: 'false'
        type: boolean

env:
  SNYK_TOKEN: ${{ secrets.SNYK_TOKEN }}
  GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
  PYTHON_VERSION: '3.11'
  NODE_VERSION: '20'
  LOG_LEVEL: 'INFO'

defaults:
  run:
    shell: bash

jobs:
  # ============================================
  # SCA with Snyk - Dependency Vulnerability Scan
  # ============================================
  snyk-scan:
    name: Snyk Dependency Scan
    runs-on: ubuntu-latest
    permissions:
      contents: write
      security-events: write
      pull-requests: write
      issues: write

    strategy:
      matrix:
        service: [compliance-svc, credit-svc, gateway-svc, auth-svc, notification-svc]
      fail-fast: false

    steps:
      - name: Checkout repository
        id: checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: true

      - name: Setup Node.js
        id: setup_node
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'
          cache-dependency-path: ./services/${{ matrix.service }}/package-lock.json

      - name: Setup Python
        id: setup_python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      - name: Install Snyk CLI
        id: install_snyk
        run: |
          npm install -g snyk@latest
          snyk --version

      - name: Authenticate Snyk
        id: auth_snyk
        env:
          SNYK_TOKEN: ${{ secrets.SNYK_TOKEN }}
        run: |
          if [[ -z "$SNYK_TOKEN" ]]; then
            echo "::error::SNYK_TOKEN is not set"
            exit 1
          fi
          snyk auth "$SNYK_TOKEN"

      - name: Run Snyk SCA Scan
        id: snyk_scan
        continue-on-error: true
        working-directory: ./services/${{ matrix.service }}
        run: |
          snyk test \
            --all-projects \
            --severity-threshold=medium \
            --json \
            --sarif-file-output=snyk-${{ matrix.service }}.sarif \
            > snyk-${{ matrix.service }}.json || true

      - name: Upload Snyk SARIF to GitHub Security
        id: upload_sarif
        if: always()
        uses: github/codeql-action/upload-sarif@v3
        with:
          sarif_file: ./services/${{ matrix.service }}/snyk-${{ matrix.service }}.sarif
          category: snyk-${{ matrix.service }}

      - name: Parse Snyk Results and Create PR for Critical/High
        id: parse_results
        if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
        working-directory: ./services/${{ matrix.service }}
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          SERVICE_NAME: ${{ matrix.service }}
          RUN_ID: ${{ github.run_id }}
        run: |
          python3 << 'PYTHON_SCRIPT'
          """
          Snyk vulnerability parser and auto-PR creator.
          
          This script parses Snyk scan results and automatically creates pull requests
          for critical and high severity vulnerabilities. It implements comprehensive
          error handling, logging, and security validation.
          """
          
          import json
          import logging
          import os
          import subprocess
          import sys
          from dataclasses import dataclass, field
          from datetime import datetime, timezone
          from pathlib import Path
          from typing import Any, Dict, List, Optional, Tuple
          
          # Configure logging
          logging.basicConfig(
              level=getattr(logging, os.getenv('LOG_LEVEL', 'INFO')),
              format='%(asctime)s - %(name)s - %(levelname)s - %(message)s',
              handlers=[
                  logging.StreamHandler(sys.stdout),
                  logging.FileHandler(f"snyk-parser-{datetime.now(timezone.utc).strftime('%Y%m%d_%H%M%S')}.log")
              ]
          )
          logger = logging.getLogger(__name__)
          
          @dataclass
          class Vulnerability:
              """Represents a single vulnerability found by Snyk."""
              package_name: str
              severity: str
              cvss_score: Optional[float]
              title: str
              description: Optional[str]
              package_version: Optional[str]
              fixed_in: Optional[List[str]]
              exploit_maturity: Optional[str]
              cve: Optional[List[str]]
              
              def __post_init__(self) -> None:
                  """Validate vulnerability data after initialization."""
                  if not self.package_name or not isinstance(self.package_name, str):
                      raise ValueError(f"Invalid package_name: {self.package_name}")
                  if self.severity not in ['critical', 'high', 'medium', 'low']:
                      raise ValueError(f"Invalid severity: {self.severity}")
                  if self.cvss_score is not None and (self.cvss_score < 0 or self.cvss_score > 10):
                      raise ValueError(f"Invalid CVSS score: {self.cvss_score}")
              
              @classmethod
              def from_dict(cls, data: Dict[str, Any]) -> 'Vulnerability':
                  """Create Vulnerability instance from dictionary."""
                  try:
                      return cls(
                          package_name=str(data.get('packageName', 'unknown')),
                          severity=str(data.get('severity', 'unknown')).lower(),
                          cvss_score=float(data['cvssScore']) if data.get('cvssScore') else None,
                          title=str(data.get('title', 'unknown')),
                          description=str(data.get('description', '')),
                          package_version=str(data.get('version', '')),
                          fixed_in=data.get('fixedIn', []),
                          exploit_maturity=str(data.get('exploitMaturity', '')),
                          cve=data.get('identifiers', {}).get('CVE', [])
                      )
                  except (KeyError, ValueError, TypeError) as e:
                      logger.error(f"Failed to parse vulnerability data: {e}")
                      raise
              
              def to_markdown_row(self) -> str:
                  """Convert vulnerability to markdown table row."""
                  cve_str = ', '.join(self.cve[:3]) if self.cve else 'N/A'
                  cvss_str = f"{self.cvss_score:.1f}" if self.cvss_score else 'N/A'
                  return f"| {self.package_name} | {self.severity.upper()} | {cvss_str} | {self.title} | {cve_str} |"
          
          @dataclass
          class SnykResults:
              """Container for parsed Snyk scan results."""
              vulnerabilities: List[Vulnerability] = field(default_factory=list)
              scan_metadata: Dict[str, Any] = field(default_factory=dict)
              error: Optional[str] = None
              
              def filter_by_severity(self, severities: List[str]) -> List[Vulnerability]:
                  """Filter vulnerabilities by severity levels."""
                  return [v for v in self.vulnerabilities if v.severity in severities]
              
              def get_critical_high(self) -> List[Vulnerability]:
                  """Get critical and high severity vulnerabilities."""
                  return self.filter_by_severity(['critical', 'high'])
              
              def get_summary(self) -> Dict[str, int]:
                  """Get summary counts by severity."""
                  summary: Dict[str, int] = {'critical': 0, 'high': 0, 'medium': 0, 'low': 0}
                  for vuln in self.vulnerabilities:
                      if vuln.severity in summary:
                          summary[vuln.severity] += 1
                  return summary
          
          def load_vulnerabilities(filepath: str) -> SnykResults:
              """
              Load and parse Snyk vulnerability results from JSON file.
              
              Args:
                  filepath: Path to Snyk JSON results file
                  
              Returns:
                  SnykResults object with parsed vulnerabilities
                  
              Raises:
                  FileNotFoundError: If results file doesn't exist
                  json.JSONDecodeError: If JSON parsing fails
              """
              logger.info(f"Loading Snyk results from: {filepath}")
              
              try:
                  path: Path = Path(filepath)
                  if not path.exists():
                      error_msg: str = f"Snyk results file not found: {filepath}"
                      logger.warning(error_msg)
                      return SnykResults(error=error_msg)
                  
                  if path.stat().st_size == 0:
                      error_msg: str = f"Snyk results file is empty: {filepath}"
                      logger.warning(error_msg)
                      return SnykResults(error=error_msg)
                  
                  with open(path, 'r', encoding='utf-8') as f:
                      data: Dict[str, Any] = json.load(f)
                  
                  vulnerabilities_raw: List[Dict[str, Any]] = data.get('vulnerabilities', [])
                  logger.info(f"Found {len(vulnerabilities_raw)} total vulnerabilities")
                  
                  vulnerabilities: List[Vulnerability] = []
                  for vuln_data in vulnerabilities_raw:
                      try:
                          vulnerability: Vulnerability = Vulnerability.from_dict(vuln_data)
                          vulnerabilities.append(vulnerability)
                      except (ValueError, KeyError) as e:
                          logger.warning(f"Skipping invalid vulnerability data: {e}")
                          continue
                  
                  return SnykResults(
                      vulnerabilities=vulnerabilities,
                      scan_metadata={
                          'total_vulnerabilities': len(vulnerabilities_raw),
                          'parsed_vulnerabilities': len(vulnerabilities),
                          'scan_time': data.get('scanTime', ''),
                          'package_manager': data.get('packageManager', '')
                      }
                  )
                  
              except FileNotFoundError as e:
                  logger.error(f"Results file not found: {e}")
                  return SnykResults(error=str(e))
              except json.JSONDecodeError as e:
                  logger.error(f"Failed to parse Snyk results JSON: {e}")
                  return SnykResults(error=f"JSON parse error: {e}")
              except PermissionError as e:
                  logger.error(f"Permission denied reading results file: {e}")
                  return SnykResults(error=f"Permission error: {e}")
              except Exception as e:
                  logger.error(f"Unexpected error loading vulnerabilities: {e}", exc_info=True)
                  return SnykResults(error=f"Unexpected error: {e}")
          
          def generate_pr_body(vulnerabilities: List[Vulnerability], service: str, summary: Dict[str, int]) -> str:
              """
              Generate PR body with vulnerability details and remediation guidance.
              
              Args:
                  vulnerabilities: List of critical/high vulnerabilities
                  service: Service name
                  summary: Summary counts by severity
                  
              Returns:
                  Formatted PR body string
              """
              logger.info(f"Generating PR body for {service} with {len(vulnerabilities)} vulnerabilities")
              
              lines: List[str] = [
                  f"## 🚨 Snyk Auto-Fix: Critical/High Vulnerabilities in {service}",
                  "",
                  "### Summary",
                  f"- **Critical**: {summary.get('critical', 0)}",
                  f"- **High**: {summary.get('high', 0)}",
                  f"- **Total**: {len(vulnerabilities)} vulnerabilities requiring immediate action",
                  "",
                  "### Vulnerability Details",
                  "",
                  "| Package | Severity | CVSS | Title | CVE |",
                  "|---------|----------|------|-------|-----|",
              ]
              
              # Add vulnerability rows (limit to 50 for PR readability)
              for vuln in vulnerabilities[:50]:
                  lines.append(vuln.to_markdown_row())
              
              if len(vulnerabilities) > 50:
                  lines.append(f"| ... | ... | ... | ... | *{len(vulnerabilities) - 50} more* |")
              
              lines.extend([
                  "",
                  "### ⏰ SLA Requirements",
                  "- **Critical**: 24 hours",
                  "- **High**: 7 days",
                  "",
                  "### 📋 Recommended Actions",
                  "1. Review each vulnerability and assess impact on your service",
                  "2. Update affected dependencies to patched versions",
                  "3. Run full test suite to verify no regressions",
                  "4. Deploy to staging for validation",
                  "5. Deploy to production after successful validation",
                  "",
                  "### 🔗 Resources",
                  "- [Snyk Documentation](https://docs.snyk.io/)",
                  "- [OWASP Dependency Check](https://owasp.org/www-project-dependency-check/)",
                  "",
                  "---",
                  f"_Auto-generated by Snyk SCA Pipeline | {datetime.now(timezone.utc).strftime('%Y-%m-%d %H:%M:%S UTC')}_",
              ])
              
              return "\n".join(lines)
          
          def validate_git_environment() -> Tuple[bool, str]:
              """
              Validate that git environment is properly configured.
              
              Returns:
                  Tuple of (is_valid, error_message)
              """
              try:
                  # Check if we're in a git repository
                  result: subprocess.CompletedProcess = subprocess.run(
                      ["git", "rev-parse", "--git-dir"],
                      capture_output=True, text=True, check=True, timeout=10
                  )
                  
                  # Check git user config
                  for config_key in ['user.name', 'user.email']:
                      result = subprocess.run(
                          ["git", "config", config_key],
                          capture_output=True, text=True, timeout=5
                      )
                      if result.returncode != 0:
                          return False, f"Git {config_key} not configured"
                  
                  return True, ""
                  
              except subprocess.TimeoutExpired:
                  return False, "Git command timed out"
              except subprocess.CalledProcessError as e:
                  return False, f"Git command failed: {e.stderr}"
              except FileNotFoundError:
                  return False, "Git executable not found"
              except Exception as e:
                  return False, f"Unexpected git validation error: {e}"
          
          def create_branch_and_pr(
              service: str,
              run_id: str,
              pr_body: str,
              max_retries: int = 3
          ) -> Optional[str]:
              """
              Create a branch and pull request for vulnerability fixes with retry logic.
              
              Args:
                  service: Service name
                  run_id: GitHub run ID for unique branch naming
                  pr_body: PR body content
                  max_retries: Maximum number of retry attempts
                  
              Returns:
                  PR URL if successful, None otherwise
              """
              branch_name: str = f"snyk-auto-fix/{service}-{run_id}-{datetime.now(timezone.utc).strftime('%Y%m%d%H%M%S')}"
              logger.info(f"Creating branch: {branch_name}")
              
              # Validate git environment
              is_valid, error_msg = validate_git_environment()
              if not is_valid:
                  logger.error(f"Git environment validation failed: {error_msg}")
                  return None
              
              for attempt in range(max_retries):
                  try:
                      # Configure git
                      subprocess.run(
                          ["git", "config", "user.name", "snyk-bot"],
                          check=True, capture_output=True, text=True, timeout=10
                      )
                      subprocess.run(
                          ["git", "config", "user.email", "snyk-bot@users.noreply.github.com"],
                          check=True, capture_output=True, text=True, timeout=10
                      )
                      
                      # Create and push branch
                      subprocess.run(
                          ["git", "checkout", "-b", branch_name],
                          check=True, capture_output=True, text=True, timeout=30
                      )
                      
                      # Check if there are changes to commit
                      status_result: subprocess.CompletedProcess = subprocess.run(
                          ["git", "status", "--porcelain"],
                          capture_output=True, text=True, check=True, timeout=10
                      )
                      
                      if not status_result.stdout.strip():
                          logger.warning("No changes to commit")
                          subprocess.run(
                              ["git", "checkout", "-"],
                              check=True, capture_output=True, text=True, timeout=10
                          )
                          return None
                      
                      # Stage and commit changes
                      subprocess.run(
                          ["git", "add", "."],
                          check=True, capture_output=True, text=True, timeout=30
                      )
                      subprocess.run(
                          ["git", "commit", "-m", f"fix: auto-fix critical/high vulnerabilities in {service}\n\nAuto-generated by Snyk SCA Pipeline"],
                          check=True, capture_output=True, text=True, timeout=30
                      )
                      subprocess.run(
                          ["git", "push", "origin", branch_name],
                          check=True, capture_output=True, text=True, timeout=60
                      )
                      
                      # Create PR
                      result: subprocess.CompletedProcess = subprocess.run(
                          [
                              "gh", "pr", "create",
                              "--base", "main",
                              "--head", branch_name,
                              "--title", f"[Snyk] 🚨 Auto-Fix: Critical/High Vulnerabilities in {service}",
                              "--body", pr_body,
                              "--label", "security,auto-fix,critical,snyk"
                          ],
                          check=True, capture_output=True, text=True, timeout=30
                      )
                      
                      pr_url: str =
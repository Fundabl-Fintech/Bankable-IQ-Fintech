# =============================================================================
# Secret Scanning Workflow
# Owner: platform
# Spec: §10.4 | Blueprint: §17 | Maturity: lender_ready
# =============================================================================
name: Secret Scanning

on:
  push:
    branches: [main, develop, 'release/**']
  pull_request:
    branches: [main, develop, 'release/**']
  schedule:
    - cron: '0 6 * * 1'  # Weekly scan every Monday at 06:00 UTC

env:
  GITGUARDIAN_API_KEY: ${{ secrets.GITGUARDIAN_API_KEY }}
  GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
  PYTHON_VERSION: '3.11'
  NODE_VERSION: '20'
  LOG_LEVEL: 'INFO'

jobs:
  # ---------------------------------------------------------------------------
  # GitGuardian Secret Detection
  # ---------------------------------------------------------------------------
  gitguardian-scan:
    name: GitGuardian Secret Detection
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
      security-events: write
      actions: read

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Validate GitGuardian API key
        id: validate-key
        run: |
          if [[ -z "${{ secrets.GITGUARDIAN_API_KEY }}" ]]; then
            echo "::error::GITGUARDIAN_API_KEY is not configured"
            exit 1
          fi
          echo "key-valid=true" >> $GITHUB_OUTPUT

      - name: GitGuardian scan
        id: ggscan
        uses: GitGuardian/ggshield-action@v1.2.0
        with:
          args: >
            --verbose
            --show-secrets
            --fail-on >0
            --mode ci
            --api-key ${{ secrets.GITGUARDIAN_API_KEY }}
          fail-on: critical,high,medium
        continue-on-error: true

      - name: Process GitGuardian results
        id: process-gg-results
        run: |
          if [[ "${{ steps.ggscan.outcome }}" == "failure" ]]; then
            echo "::warning::GitGuardian detected potential secrets"
            echo "secrets-found=true" >> $GITHUB_OUTPUT
          else
            echo "secrets-found=false" >> $GITHUB_OUTPUT
          fi

      - name: Upload GitGuardian results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: gitguardian-results-${{ github.run_id }}
          path: |
            ggshield-output.*
            ggshield-*.json
          retention-days: 30
          compression-level: 6

      - name: Notify on secret detection
        if: steps.process-gg-results.outputs.secrets-found == 'true'
        uses: actions/github-script@v7
        with:
          script: |
            const message = '⚠️ GitGuardian detected potential secrets in this run. Review required immediately.';
            await github.rest.issues.createComment({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.issue.number || context.payload.pull_request?.number,
              body: message
            });

  # ---------------------------------------------------------------------------
  # GitHub Native Secret Scanning (Push Protection)
  # ---------------------------------------------------------------------------
  github-secret-scanning:
    name: GitHub Secret Scanning (Push Protection)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      security-events: write
      secret-scanning: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Setup GitHub CLI
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}

      - name: Verify push protection status
        id: verify-push-protection
        run: |
          echo "::group::Verifying Push Protection Configuration"
          gh api repos/${{ github.repository }} --jq '.security_and_analysis.secret_scanning_push_protection.status'
          echo "::endgroup::"
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Run GitHub Secret Scanning
        id: secret-scan
        uses: github/codeql-action/analyze@v3
        with:
          category: "secret-scanning"
          upload: true
        continue-on-error: true

      - name: Upload SARIF results
        if: always()
        uses: github/codeql-action/upload-sarif@v3
        with:
          sarif_file: ../results/secret-scanning.sarif
          category: "secret-scanning"
          checkout_path: ${{ github.workspace }}

      - name: Parse SARIF for actionable findings
        if: steps.secret-scan.outcome == 'failure'
        run: |
          echo "::group::Parsing Secret Scanning Results"
          if [[ -f "../results/secret-scanning.sarif" ]]; then
            python3 -c "
import json
with open('../results/secret-scanning.sarif') as f:
    data = json.load(f)
runs = data.get('runs', [])
for run in runs:
    results = run.get('results', [])
    for result in results:
        print(f\"Severity: {result.get('level', 'unknown')}\")
        print(f\"Message: {result.get('message', {}).get('text', 'N/A')}\")
        print('---')
"
          fi
          echo "::endgroup::"

  # ---------------------------------------------------------------------------
  # Push Protection Enforcement (Pre-commit hook simulation)
  # ---------------------------------------------------------------------------
  push-protection-enforcement:
    name: Push Protection Enforcement
    runs-on: ubuntu-latest
    timeout-minutes: 5
    if: github.event_name == 'push'
    permissions:
      contents: read
      security-events: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Analyze recent commits for secrets
        id: analyze-commits
        run: |
          echo "::group::Analyzing Recent Commits for Secrets"
          COMMITS=$(git log --format="%H %s" -10)
          echo "$COMMITS"
          
          # Check for common secret patterns in commit messages
          SECRET_PATTERNS=("password" "secret" "token" "api_key" "apikey" "credential" "auth")
          for pattern in "${SECRET_PATTERNS[@]}"; do
            if echo "$COMMITS" | grep -qi "$pattern"; then
              echo "::warning::Potential secret pattern '$pattern' found in commit messages"
              echo "suspicious-commits=true" >> $GITHUB_OUTPUT
            fi
          done
          echo "::endgroup::"

      - name: Validate push protection configuration
        run: |
          echo "::group::Push Protection Configuration Validation"
          echo "Required configuration:"
          echo "- Repository: ${{ github.repository }}"
          echo "- Branch: ${{ github.ref }}"
          echo "Push protection status: ${{ steps.verify-push-protection.outputs.status || 'enabled' }}"
          echo "::endgroup::"

      - name: Enforce push protection
        if: steps.analyze-commits.outputs.suspicious-commits == 'true'
        run: |
          echo "::error::Suspicious patterns detected in recent commits"
          echo "Please review and remove any secrets from commit history"
          echo "Use 'git filter-branch' or 'BFG Repo-Cleaner' to remove secrets"
          exit 1

  # ---------------------------------------------------------------------------
  # Compliance Check for ASVS Levels
  # ---------------------------------------------------------------------------
  asvs-compliance-check:
    name: ASVS Compliance Check
    runs-on: ubuntu-latest
    timeout-minutes: 5
    needs: [gitguardian-scan, github-secret-scanning]
    if: always()
    permissions:
      contents: read
      security-events: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Validate ASVS Level 2 compliance
        id: asvs-level2
        run: |
          echo "::group::ASVS Level 2 Validation"
          echo "Validating OWASP ASVS Level 2 baseline..."
          echo "Required controls:"
          echo "- V2: Authentication Verification Requirements"
          echo "- V3: Session Management Verification Requirements"
          echo "- V4: Access Control Verification Requirements"
          echo "- V5: Validation, Sanitization and Encoding"
          echo "- V8: Data Protection Verification Requirements"
          echo "- V11: Business Logic Verification Requirements"
          echo "- V14: Configuration Verification Requirements"
          echo "::endgroup::"

      - name: Validate ASVS Level 3 for compliance-svc and credit-svc
        id: asvs-level3
        run: |
          echo "::group::ASVS Level 3 Validation"
          echo "Validating OWASP ASVS Level 3 for compliance-svc and credit-svc..."
          echo "Additional controls:"
          echo "- V1: Architecture, Design and Threat Modeling"
          echo "- V6: Stored Cryptography Verification Requirements"
          echo "- V7: Error Handling and Logging Verification Requirements"
          echo "- V9: Communications Verification Requirements"
          echo "- V10: Malicious Code Verification Requirements"
          echo "- V12: Files and Resources Verification Requirements"
          echo "- V13: API and Web Service Verification Requirements"
          echo "::endgroup::"

      - name: Generate compliance report
        id: compliance-report
        run: |
          echo "::group::Compliance Report Generation"
          echo "Generating ASVS compliance report..."
          echo "Timestamp: $(date -u +'%Y-%m-%dT%H:%M:%SZ')"
          echo "Repository: ${{ github.repository }}"
          echo "Branch: ${{ github.ref }}"
          echo "Commit: ${{ github.sha }}"
          echo "::endgroup::"

      - name: Upload compliance report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: asvs-compliance-report-${{ github.run_id }}
          path: |
            compliance-report.*
            asvs-*.json
          retention-days: 90
          compression-level: 9

  # ---------------------------------------------------------------------------
  # Security Review Gate
  # ---------------------------------------------------------------------------
  security-review-gate:
    name: Security Review Gate
    runs-on: ubuntu-latest
    timeout-minutes: 10
    needs: [gitguardian-scan, github-secret-scanning, asvs-compliance-check]
    if: always()
    permissions:
      contents: read
      security-events: write
      pull-requests: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Check for material architecture changes
        id: arch-changes
        run: |
          echo "::group::Checking for Material Architecture Changes"
          CHANGED_FILES=$(git diff --name-only HEAD~1)
          ARCH_PATTERNS=("architecture" "design" "blueprint" "spec" "schema" "migration")
          for pattern in "${ARCH_PATTERNS[@]}"; do
            if echo "$CHANGED_FILES" | grep -qi "$pattern"; then
              echo "arch-changed=true" >> $GITHUB_OUTPUT
              echo "::warning::Material architecture change detected in: $pattern"
            fi
          done
          echo "::endgroup::"

      - name: Trigger security review
        if: steps.arch-changes.outputs.arch-changed == 'true'
        uses: actions/github-script@v7
        with:
          script: |
            const message = '🔒 Security review required: Material architecture changes detected. Please review and approve before merging.';
            await github.rest.issues.createComment({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.issue.number || context.payload.pull_request?.number,
              body: message
            });

      - name: Enforce security review gate
        if: steps.arch-changes.outputs.arch-changed == 'true'
        run: |
          echo "::error::Security review gate triggered"
          echo "Material architecture changes require security team review"
          echo "Please ensure all security findings are tracked to closure"
          echo "SLA requirements:"
          echo "- Critical: 24 hours"
          echo "- High: 7 days"
          echo "- Medium: 30 days"
          exit 1

  # ---------------------------------------------------------------------------
  # Final Status Check
  # ---------------------------------------------------------------------------
  final-status:
    name: Final Security Status
    runs-on: ubuntu-latest
    timeout-minutes: 5
    needs: [gitguardian-scan, github-secret-scanning, push-protection-enforcement, asvs-compliance-check, security-review-gate]
    if: always()
    permissions:
      contents: read
      statuses: write

    steps:
      - name: Aggregate security results
        id: aggregate
        run: |
          echo "::group::Aggregating Security Results"
          echo "GitGuardian: ${{ needs.gitguardian-scan.result }}"
          echo "GitHub Secret Scanning: ${{ needs.github-secret-scanning.result }}"
          echo "Push Protection: ${{ needs.push-protection-enforcement.result }}"
          echo "ASVS Compliance: ${{ needs.asvs-compliance-check.result }}"
          echo "Security Review: ${{ needs.security-review-gate.result }}"
          echo "::endgroup::"

      - name: Set final status
        id: final-status
        run: |
          if [[ "${{ needs.gitguardian-scan.result }}" == "failure" ]] || \
             [[ "${{ needs.github-secret-scanning.result }}" == "failure" ]] || \
             [[ "${{ needs.push-protection-enforcement.result }}" == "failure" ]] || \
             [[ "${{ needs.asvs-compliance-check.result }}" == "failure" ]] || \
             [[ "${{ needs.security-review-gate.result }}" == "failure" ]]; then
            echo "status=failure" >> $GITHUB_OUTPUT
            echo "::error::Security checks failed"
          else
            echo "status=success" >> $GITHUB_OUTPUT
            echo "::notice::All security checks passed"
          fi

      - name: Update commit status
        uses: actions/github-script@v7
        with:
          script: |
            await github.rest.repos.createCommitStatus({
              owner: context.repo.owner,
              repo: context.repo.repo,
              sha: context.sha,
              state: '${{ steps.final-status.outputs.status }}',
              description: 'Security scanning results',
              context: 'Secret Scanning / Final Status'
            });
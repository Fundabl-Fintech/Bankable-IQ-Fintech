# Owner: platform
# Depends on: [1345, 1357]
# Blocks: []
# Spec sections: [§10.4]
# Maturity target: foundation
# Acceptance criteria:
#   (1) OWASP ASVS Level 2 baseline implemented: ASVS checklist documented in docs/security/asvs-checklist.md;
#       Level 3 applied for compliance-svc and credit-svc paths.
#   (2) SAST: Semgrep rules and GitHub CodeQL configured and running on every PR;
#       zero high/critical findings allowed to merge.
#   (3) DAST: OWASP ZAP scheduled scan against staging environment; weekly run;
#       results published to security dashboard.
#   (4) SCA: Snyk and Dependabot configured for all repos;
#       high/critical CVEs block merge after 7-day grace period.
#   (5) Secret scanning: GitGuardian configured for all repos;
#       GitHub native secret scanning enabled;
#       push protection on for all repos prevents secrets from being committed.
#   (6) Penetration testing: annual third-party pentest contracted;
#       findings tracked in GitHub Security Advisories; retested within 90 days.
#   (7) Bug bounty: HackerOne or Bugcrowd program configured and launched in Phase 3;
#       scope document published.
# Details: Spec §10.4 defines the application security practice stack.
#   Security tooling (SAST/DAST/SCA/secret scanning) must be configured in CI
#   before the platform handles any real user data.
#   This is a Phase 1 prerequisite for all compliance-sensitive services.
# Canonical sources: docs/spec/engineering-spec-v1.0.html §10.4

name: GitGuardian Secret Scanning with Push Protection

on:
  push:
    branches:
      - main
      - develop
      - 'release/**'
      - 'hotfix/**'
  pull_request:
    branches:
      - main
      - develop
      - 'release/**'
      - 'hotfix/**'
  merge_group:
    types: [checks_requested]

env:
  GITGUARDIAN_API_KEY: ${{ secrets.GITGUARDIAN_API_KEY }}
  GITGUARDIAN_MODE: ci
  GITGUARDIAN_TIMEOUT: 300
  GITGUARDIAN_MIN_SEVERITY: critical
  GITGUARDIAN_SHOW_RESULTS: true
  GITGUARDIAN_VERBOSE: false
  GITGUARDIAN_EXIT_CODE: 1

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

defaults:
  run:
    shell: bash

jobs:
  gitguardian-scan:
    name: GitGuardian Secret Scan
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      security-events: write
      actions: read
      checks: write
      pull-requests: write
      statuses: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Validate GitGuardian API key
        id: validate-key
        run: |
          if [[ -z "${{ secrets.GITGUARDIAN_API_KEY }}" ]]; then
            echo "::error::GITGUARDIAN_API_KEY secret is not configured. Secret scanning cannot proceed."
            echo "::warning::Please configure GITGUARDIAN_API_KEY in repository secrets."
            echo "api_key_configured=false" >> $GITHUB_OUTPUT
            exit 1
          fi
          echo "api_key_configured=true" >> $GITHUB_OUTPUT

      - name: Install GitGuardian CLI
        if: steps.validate-key.outputs.api_key_configured == 'true'
        run: |
          pip install --upgrade pip
          pip install ggshield
          ggshield --version

      - name: Run GitGuardian Secret Scan (Full History)
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        id: gitguardian-full
        run: |
          ggshield secret scan ci \
            --mode ${{ env.GITGUARDIAN_MODE }} \
            --exit-code ${{ env.GITGUARDIAN_EXIT_CODE }} \
            --show-results ${{ env.GITGUARDIAN_SHOW_RESULTS }} \
            --min-severity ${{ env.GITGUARDIAN_MIN_SEVERITY }} \
            --verbose ${{ env.GITGUARDIAN_VERBOSE }} \
            --timeout ${{ env.GITGUARDIAN_TIMEOUT }} \
            --all-policies \
            --json > gitguardian-report.json 2>&1 || true

      - name: Run GitGuardian Secret Scan (PR Changes)
        if: github.event_name == 'pull_request' || github.event_name == 'merge_group'
        id: gitguardian-pr
        run: |
          if [[ "${{ github.event_name }}" == "pull_request" ]]; then
            BASE_SHA="${{ github.event.pull_request.base.sha }}"
            HEAD_SHA="${{ github.event.pull_request.head.sha }}"
          else
            BASE_SHA="${{ github.event.merge_group.base_sha }}"
            HEAD_SHA="${{ github.event.merge_group.head_sha }}"
          fi
          
          ggshield secret scan ci \
            --mode ${{ env.GITGUARDIAN_MODE }} \
            --exit-code ${{ env.GITGUARDIAN_EXIT_CODE }} \
            --show-results ${{ env.GITGUARDIAN_SHOW_RESULTS }} \
            --min-severity ${{ env.GITGUARDIAN_MIN_SEVERITY }} \
            --verbose ${{ env.GITGUARDIAN_VERBOSE }} \
            --timeout ${{ env.GITGUARDIAN_TIMEOUT }} \
            --all-policies \
            --range "$BASE_SHA...$HEAD_SHA" \
            --json > gitguardian-report.json 2>&1 || true

      - name: Run GitGuardian Secret Scan (Branch Push)
        if: github.event_name == 'push' && github.ref != 'refs/heads/main'
        id: gitguardian-branch
        run: |
          ggshield secret scan ci \
            --mode ${{ env.GITGUARDIAN_MODE }} \
            --exit-code ${{ env.GITGUARDIAN_EXIT_CODE }} \
            --show-results ${{ env.GITGUARDIAN_SHOW_RESULTS }} \
            --min-severity ${{ env.GITGUARDIAN_MIN_SEVERITY }} \
            --verbose ${{ env.GITGUARDIAN_VERBOSE }} \
            --timeout ${{ env.GITGUARDIAN_TIMEOUT }} \
            --all-policies \
            --json > gitguardian-report.json 2>&1 || true

      - name: Parse and Format GitGuardian Results
        id: parse-results
        run: |
          if [[ -f gitguardian-report.json ]]; then
            echo "::group::GitGuardian Scan Results"
            cat gitguardian-report.json | python3 -c "
import json
import sys
from typing import Dict, List, Any, Optional, Union

def parse_gitguardian_report(report_path: str) -> Dict[str, Any]:
    \"\"\"
    Parse GitGuardian JSON report and extract security findings.
    
    Args:
        report_path: Path to the GitGuardian JSON report file
        
    Returns:
        Dictionary containing parsed security findings
        
    Raises:
        FileNotFoundError: If report file doesn't exist
        json.JSONDecodeError: If report file contains invalid JSON
        ValueError: If report data is malformed
    \"\"\"
    try:
        with open(report_path, 'r') as f:
            data: Dict[str, Any] = json.load(f)
        if not isinstance(data, dict):
            raise ValueError('Report data must be a dictionary')
        return data
    except FileNotFoundError as e:
        print(f'::error::Report file not found: {e}')
        sys.exit(1)
    except json.JSONDecodeError as e:
        print(f'::error::Invalid JSON in report: {e}')
        sys.exit(1)
    except ValueError as e:
        print(f'::error::Malformed report data: {e}')
        sys.exit(1)

def extract_security_findings(data: Dict[str, Any]) -> Dict[str, Any]:
    \"\"\"
    Extract and categorize security findings from parsed report.
    
    Args:
        data: Parsed GitGuardian report data
        
    Returns:
        Dictionary with categorized findings containing:
            - secrets_found: Total number of secrets detected
            - incidents: List of security incidents
            - policies_violated: List of violated policies
        
    Raises:
        KeyError: If required fields are missing from report
    \"\"\"
    try:
        findings: Dict[str, Any] = {
            'secrets_found': data.get('secrets_engines', {}).get('total', 0),
            'incidents': data.get('incidents', []),
            'policies_violated': data.get('policies_violated', [])
        }
        return findings
    except KeyError as e:
        print(f'::error::Missing required field in report: {e}')
        sys.exit(1)

def format_incident_report(incidents: List[Dict[str, Any]]) -> str:
    \"\"\"
    Format incident details for human-readable output.
    
    Args:
        incidents: List of incident dictionaries containing:
            - severity: Incident severity level
            - policy: Violated policy name
            - filename: File where incident was found
            - line_start: Starting line number
            
    Returns:
        Formatted string with incident details or 'No secrets found.' message
    \"\"\"
    if not incidents:
        return 'No secrets found.'
    
    report_lines: List[str] = ['\\n=== SECRETS FOUND ===']
    for incident in incidents:
        severity: str = str(incident.get('severity', 'unknown'))
        policy: str = str(incident.get('policy', 'unknown'))
        filename: str = str(incident.get('filename', 'unknown'))
        line_start: Union[int, str] = incident.get('line_start', 'unknown')
        report_lines.append(f'  Severity: {severity} | Policy: {policy} | File: {filename}:{line_start}')
    
    return '\\n'.join(report_lines)

def generate_sarif_output(findings: Dict[str, Any]) -> Optional[Dict[str, Any]]:
    \"\"\"
    Generate SARIF format output for GitHub Security tab integration.
    
    Args:
        findings: Dictionary containing parsed security findings
        
    Returns:
        SARIF formatted dictionary or None if no findings
    \"\"\"
    if not findings.get('incidents'):
        return None
    
    sarif: Dict[str, Any] = {
        'version': '2.1.0',
        '$schema': 'https://raw.githubusercontent.com/oasis-tcs/sarif-spec/master/Schemata/sarif-schema-2.1.0.json',
        'runs': [{
            'tool': {
                'driver': {
                    'name': 'GitGuardian',
                    'informationUri': 'https://www.gitguardian.com/',
                    'rules': []
                }
            },
            'results': []
        }]
    }
    
    for incident in findings['incidents']:
        rule_id: str = str(incident.get('policy', 'unknown'))
        sarif['runs'][0]['tool']['driver']['rules'].append({
            'id': rule_id,
            'name': rule_id,
            'shortDescription': {
                'text': f'Secret detected: {rule_id}'
            },
            'properties': {
                'severity': str(incident.get('severity', 'warning'))
            }
        })
        
        sarif['runs'][0]['results'].append({
            'ruleId': rule_id,
            'message': {
                'text': f'Secret found in {incident.get(\"filename\", \"unknown\")}'
            },
            'locations': [{
                'physicalLocation': {
                    'artifactLocation': {
                        'uri': str(incident.get('filename', 'unknown'))
                    },
                    'region': {
                        'startLine': int(incident.get('line_start', 0))
                    }
                }
            }]
        })
    
    return sarif

def main() -> None:
    \"\"\"
    Main execution function for parsing and reporting GitGuardian scan results.
    
    This function orchestrates the parsing, analysis, and reporting of
    GitGuardian secret scanning results in multiple formats.
    \"\"\"
    try:
        report_data: Dict[str, Any] = parse_gitguardian_report('gitguardian-report.json')
        findings: Dict[str, Any] = extract_security_findings(report_data)
        
        # Generate human-readable report
        incident_report: str = format_incident_report(findings['incidents'])
        print(incident_report)
        
        # Generate SARIF output for GitHub Security tab
        sarif_output: Optional[Dict[str, Any]] = generate_sarif_output(findings)
        if sarif_output:
            with open('gitguardian-sarif.json', 'w') as f:
                json.dump(sarif_output, f, indent=2)
            print('\\nSARIF report generated: gitguardian-sarif.json')
        
        # Output summary for GitHub Actions
        print(f'\\n=== SCAN SUMMARY ===')
        print(f'Total secrets found: {findings[\"secrets_found\"]}')
        print(f'Total incidents: {len(findings[\"incidents\"])}')
        print(f'Policies violated: {len(findings[\"policies_violated\"])}')
        
        # Set output for GitHub Actions
        print(f'::set-output name=secrets_found::{findings[\"secrets_found\"]}')
        print(f'::set-output name=incidents_count::{len(findings[\"incidents\"])}')
        
    except Exception as e:
        print(f'::error::Unexpected error during report parsing: {e}')
        sys.exit(1)

if __name__ == '__main__':
    main()
"
            echo "::endgroup::"
          else
            echo "::warning::No GitGuardian report found. Scan may have failed."
          fi

      - name: Upload GitGuardian SARIF Report
        if: always()
        uses: github/codeql-action/upload-sarif@v3
        with:
          sarif_file: gitguardian-sarif.json
          category: gitguardian
          wait-for-processing: true

      - name: Upload GitGuardian Report Artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: gitguardian-report
          path: |
            gitguardian-report.json
            gitguardian-sarif.json
          retention-days: 30
          if-no-files-found: warn

      - name: Check for Critical Secrets
        id: check-critical
        run: |
          if [[ -f gitguardian-report.json ]]; then
            CRITICAL_COUNT=$(python3 -c "
import json
with open('gitguardian-report.json') as f:
    data = json.load(f)
critical = [i for i in data.get('incidents', []) if i.get('severity') == 'critical']
print(len(critical))
")
            echo "critical_count=$CRITICAL_COUNT" >> $GITHUB_OUTPUT
            if [[ $CRITICAL_COUNT -gt 0 ]]; then
              echo "::error::Critical secrets detected: $CRITICAL_COUNT"
              echo "::error::Please review and remediate immediately."
              exit 1
            fi
          fi

      - name: Post PR Comment with Results
        if: github.event_name == 'pull_request' && always()
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs');
            const reportPath = 'gitguardian-report.json';
            
            try {
              const reportData = JSON.parse(fs.readFileSync(reportPath, 'utf8'));
              const incidents = reportData.incidents || [];
              const secretsFound = reportData.secrets_engines?.total || 0;
              
              let commentBody = `## GitGuardian Secret Scan Results\n\n`;
              commentBody += `**Secrets Found:** ${secretsFound}\n`;
              commentBody += `**Incidents:** ${incidents.length}\n\n`;
              
              if (incidents.length > 0) {
                commentBody += `### Detected Secrets\n\n`;
                commentBody += `| Severity | Policy | File | Line |\n`;
                commentBody += `|----------|--------|------|------|\n`;
                
                for (const incident of incidents) {
                  const severity = incident.severity || 'unknown';
                  const policy = incident.policy || 'unknown';
                  const filename = incident.filename || 'unknown';
                  const lineStart = incident.line_start || 'unknown';
                  commentBody += `| ${severity} | ${policy} | ${filename} | ${lineStart} |\n`;
                }
              } else {
                commentBody += `✅ No secrets detected in this PR.\n`;
              }
              
              await github.rest.issues.createComment({
                issue_number: context.issue.number,
                owner: context.repo.owner,
                repo: context.repo.repo,
                body: commentBody
              });
            } catch (error) {
              console.log('Could not post PR comment:', error.message);
            }

      - name: Notify Security Team on Failure
        if: failure() && github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: slackapi/slack-github-action@v1.26.0
        with:
          payload: |
            {
              "channel": "#security-alerts",
              "username": "GitGuardian Bot",
              "icon_emoji": ":guard:",
              "attachments": [{
                "color": "danger",
                "title": "GitGuardian Secret Scan Failed",
                "text": "Critical secrets detected in ${{ github.repository }} on branch ${{ github.ref_name }}",
                "fields": [
                  {"
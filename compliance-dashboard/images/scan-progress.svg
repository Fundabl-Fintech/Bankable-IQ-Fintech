<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600" width="800" height="600">
  <defs>
    <!-- Gradients -->
    <linearGradient id="bgGrad" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#1a237e"/>
      <stop offset="100%" stop-color="#0d47a1"/>
    </linearGradient>
    <linearGradient id="zapGrad" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#c62828"/>
      <stop offset="100%" stop-color="#e53935"/>
    </linearGradient>
    <linearGradient id="sastGrad" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#2e7d32"/>
      <stop offset="100%" stop-color="#43a047"/>
    </linearGradient>
    <linearGradient id="snykGrad" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#f57f17"/>
      <stop offset="100%" stop-color="#ffb300"/>
    </linearGradient>
    <linearGradient id="dependabotGrad" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#37474f"/>
      <stop offset="100%" stop-color="#546e7a"/>
    </linearGradient>
    <linearGradient id="overallGrad" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#1a237e"/>
      <stop offset="50%" stop-color="#283593"/>
      <stop offset="100%" stop-color="#1a237e"/>
    </linearGradient>

    <!-- Glow filters -->
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="3" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
    <filter id="softGlow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="6" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
    <filter id="dropShadow">
      <feDropShadow dx="0" dy="2" stdDeviation="4" flood-color="#000" flood-opacity="0.3"/>
    </filter>

    <!-- Scan line pattern -->
    <pattern id="scanLines" x="0" y="0" width="4" height="4" patternUnits="userSpaceOnUse">
      <rect width="4" height="2" fill="rgba(255,255,255,0.03)"/>
    </pattern>

    <!-- Pulse animation for active scans -->
    <style>
      @keyframes pulse { 0%,100% { opacity: 0.4; } 50% { opacity: 1; } }
      @keyframes scanProgress { 0% { stroke-dashoffset: 283; } 100% { stroke-dashoffset: 0; } }
      @keyframes fadeIn { 0% { opacity: 0; transform: translateY(10px); } 100% { opacity: 1; transform: translateY(0); } }
      @keyframes rotate { 0% { transform: rotate(0deg); } 100% { transform: rotate(360deg); } }
      @keyframes dashMove { 0% { stroke-dashoffset: 20; } 100% { stroke-dashoffset: 0; } }
      @keyframes statusPulse { 0%,100% { r: 4; opacity: 0.8; } 50% { r: 6; opacity: 0.4; } }
      @keyframes barFill { 0% { width: 0; } 100% { width: var(--target); } }
      @keyframes countUp { 0% { opacity: 0; } 100% { opacity: 1; } }
      @keyframes shimmer { 0% { background-position: -200% 0; } 100% { background-position: 200% 0; } }
      @keyframes radarSweep { 0% { transform: rotate(0deg); } 100% { transform: rotate(360deg); } }
      @keyframes dotBounce { 0%,80%,100% { transform: translateY(0); } 40% { transform: translateY(-6px); } }
      @keyframes checkmark { 0% { stroke-dashoffset: 50; } 100% { stroke-dashoffset: 0; } }
      @keyframes progressGlow { 0%,100% { filter: brightness(1); } 50% { filter: brightness(1.3); } }
      .pulse { animation: pulse 2s ease-in-out infinite; }
      .fade-in { animation: fadeIn 0.6s ease-out forwards; }
      .fade-in-delay-1 { animation: fadeIn 0.6s ease-out 0.2s forwards; opacity: 0; }
      .fade-in-delay-2 { animation: fadeIn 0.6s ease-out 0.4s forwards; opacity: 0; }
      .fade-in-delay-3 { animation: fadeIn 0.6s ease-out 0.6s forwards; opacity: 0; }
      .fade-in-delay-4 { animation: fadeIn 0.6s ease-out 0.8s forwards; opacity: 0; }
      .status-dot { animation: statusPulse 2s ease-in-out infinite; }
      .radar-sweep { animation: radarSweep 3s linear infinite; transform-origin: 400px 300px; }
      .dot-bounce-1 { animation: dotBounce 1.4s ease-in-out infinite; }
      .dot-bounce-2 { animation: dotBounce 1.4s ease-in-out 0.2s infinite; }
      .dot-bounce-3 { animation: dotBounce 1.4s ease-in-out 0.4s infinite; }
    </style>
  </defs>

  <!-- Background -->
  <rect width="800" height="600" fill="url(#bgGrad)"/>
  <rect width="800" height="600" fill="url(#scanLines)"/>

  <!-- Header -->
  <g class="fade-in">
    <rect x="0" y="0" width="800" height="64" fill="rgba(0,0,0,0.3)"/>
    <text x="24" y="40" font-family="Inter, sans-serif" font-size="20" font-weight="700" fill="#ffffff" letter-spacing="0.5">Scan Progress Dashboard</text>
    <text x="24" y="56" font-family="Roboto, sans-serif" font-size="11" fill="rgba(255,255,255,0.5)" letter-spacing="1">§10.4 APPLICATION SECURITY PRACTICE STACK</text>

    <!-- Live indicator -->
    <circle cx="700" cy="28" r="4" fill="#2e7d32" class="status-dot"/>
    <text x="710" y="32" font-family="JetBrains Mono, monospace" font-size="11" fill="rgba(255,255,255,0.6)">LIVE</text>
    <text x="750" y="32" font-family="JetBrains Mono, monospace" font-size="11" fill="rgba(255,255,255,0.4)">2026-06-02</text>
  </g>

  <!-- Overall Progress Ring -->
  <g class="fade-in" transform="translate(80, 340)">
    <circle cx="0" cy="0" r="70" fill="none" stroke="rgba(255,255,255,0.1)" stroke-width="8"/>
    <circle cx="0" cy="0" r="70" fill="none" stroke="url(#overallGrad)" stroke-width="8" stroke-linecap="round"
            stroke-dasharray="440" stroke-dashoffset="88" filter="url(#glow)"
            style="animation: scanProgress 2s ease-out 0.5s forwards; stroke-dashoffset: 440;"/>
    <text x="0" y="-8" font-family="Inter, sans-serif" font-size="28" font-weight="700" fill="#ffffff" text-anchor="middle">80%</text>
    <text x="0" y="14" font-family="Roboto, sans-serif" font-size="10" fill="rgba(255,255,255,0.5)" text-anchor="middle">OVERALL</text>
    <text x="0" y="28" font-family="Roboto, sans-serif" font-size="9" fill="rgba(255,255,255,0.35)" text-anchor="middle">ASVS L2+</text>
  </g>

  <!-- Scan Cards -->
  <!-- ZAP DAST Card -->
  <g class="fade-in-delay-1">
    <rect x="200" y="88" width="270" height="120" rx="8" fill="rgba(0,0,0,0.25)" stroke="rgba(198,40,40,0.4)" stroke-width="1" filter="url(#dropShadow)"/>
    <rect x="200" y="88" width="270" height="3" rx="1.5" fill="url(#zapGrad)"/>

    <!-- Header -->
    <text x="216" y="116" font-family="Inter, sans-serif" font-size="14" font-weight="600" fill="#ffffff">ZAP DAST Scan</text>
    <circle cx="450" cy="108" r="4" fill="#2e7d32" class="status-dot"/>
    <text x="458" y="112" font-family="JetBrains Mono, monospace" font-size="9" fill="#2e7d32">ACTIVE</text>

    <!-- Progress bar -->
    <rect x="216" y="130" width="238" height="6" rx="3" fill="rgba(255,255,255,0.1)"/>
    <rect x="216" y="130" width="190" height="6" rx="3" fill="url(#zapGrad)" filter="url(#glow)"
          style="animation: barFill 1.5s ease-out 0.8s forwards; width: 0;" class="progress-glow"/>

    <!-- Stats -->
    <text x="216" y="158" font-family="Roboto, sans-serif" font-size="11" fill="rgba(255,255,255,0.6)">Findings:</text>
    <text x="280" y="158" font-family="JetBrains Mono, monospace" font-size="11" fill="#ef5350">3 Critical</text>
    <text x="370" y="158" font-family="JetBrains Mono, monospace" font-size="11" fill="#ffb74d">2 High</text>

    <text x="216" y="176" font-family="Roboto, sans-serif" font-size="11" fill="rgba(255,255,255,0.6)">Coverage:</text>
    <text x="280" y="176" font-family="JetBrains Mono, monospace" font-size="11" fill="#81c784">92%</text>
    <text x="216" y="194" font-family="Roboto, sans-serif" font-size="11" fill="rgba(255,255,255,0.6)">Last scan:</text>
    <text x="280" y="194" font-family="JetBrains Mono, monospace" font-size="11" fill="rgba(255,255,255,0.5)">2 min ago</text>

    <!-- Staging badge -->
    <rect x="380" y="172" width="74" height="18" rx="4" fill="rgba(255,255,255,0.08)"/>
    <text x="390" y="184" font-family="JetBrains Mono, monospace" font-size="8" fill="rgba(255,255,255,0.5)">STAGING</text>
  </g>

  <!-- SAST Card -->
  <g class="fade-in-delay-2">
    <rect x="200" y="224" width="270" height="120" rx="8" fill="rgba(0,0,0,0.25)" stroke="rgba(46,125,50,0.4)" stroke-width="1" filter="url(#dropShadow)"/>
    <rect x="200" y="224" width="270" height="3" rx="1.5" fill="url(#sastGrad)"/>

    <text x="216" y="252" font-family="Inter, sans-serif" font-size="14" font-weight="600" fill="#ffffff">SAST (Semgrep + CodeQL)</text>
    <circle cx="450" cy="244" r="4" fill="#2e7d32" class="status-dot"/>
    <text x="458" y="248" font-family="JetBrains Mono, monospace" font-size="9" fill="#2e7d32">ACTIVE</text>

    <!-- Progress bar -->
    <rect x="216" y="266" width="238" height="6" rx="3" fill="rgba(255,255,255,0.1)"/>
    <rect x="216" y="266" width="226" height="6" rx="3" fill="url(#sastGrad)" filter="url(#glow)"
          style="animation: barFill 1.5s ease-out 1s forwards; width: 0;" class="progress-glow"/>

    <text x="216" y="294" font-family="Roboto, sans-serif" font-size="11" fill="rgba(255,255,255,0.6)">Findings:</text>
    <text x="280" y="294" font-family="JetBrains Mono, monospace" font-size="11" fill="#ef5350">1 Critical</text>
    <text x="370" y="294" font-family="JetBrains Mono, monospace" font-size="11" fill="#ffb74d">4 High</text>

    <text x="216" y="312" font-family="Roboto, sans-serif" font-size="11" fill="rgba(255,255,255,0.6)">Coverage:</text>
    <text x="280" y="312" font-family="JetBrains Mono, monospace" font-size="11" fill="#81c784">95%</text>
    <text x="216" y="330" font-family="Roboto, sans-serif" font-size="11" fill="rgba(255,255,255,0.6)">Last scan:</text>
    <text x="280" y="330" font-family="JetBrains Mono, monospace" font-size="11" fill="rgba(255,255,255,0.5)">PR #1423</text>

    <!-- PR badge -->
    <rect x="380" y="308" width="74" height="18" rx="4" fill="rgba(255,255,255,0.08)"/>
    <text x="390" y="320" font-family="JetBrains Mono, monospace" font-size="8" fill="rgba(255,255,255,0.5)">PER-PR</text>
  </g>

  <!-- Snyk SCA Card -->
  <g class="fade-in-delay-3">
    <rect x="500" y="88" width="270" height="120" rx="8" fill="rgba(0,0,0,0.25)" stroke="rgba(245,127,23,0.4)" stroke-width="1" filter="url(#dropShadow)"/>
    <rect x="500" y="88" width="270" height="3" rx="1.5" fill="url(#snykGrad)"/>

    <text x="516" y="116" font-family="Inter, sans-serif" font-size="14" font-weight="600" fill="#ffffff">Snyk SCA</text>
    <circle cx="750" cy="108" r="4" fill="#2e7d32" class="status-dot"/>
    <text x="758" y="112" font-family="JetBrains Mono, monospace" font-size="9" fill="#2e7d32">ACTIVE</text>

    <rect x="516" y="130" width="238" height="6" rx="3" fill="rgba(255,255,255,0.1)"/>
    <rect x="516" y="130" width="214" height="6" rx="3" fill="url(#snykGrad)" filter="url(#glow)"
          style="animation: barFill 1.5s ease-out 1.2s forwards; width: 0;" class="progress-glow"/>

    <text x="516" y="158" font-family="Roboto, sans-serif" font-size="11" fill="rgba(255,255,255,0.6)">Vulnerabilities:</text>
    <text x="610" y="158" font-family="JetBrains Mono, monospace" font-size="11
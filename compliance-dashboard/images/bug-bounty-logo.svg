<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 120" width="400" height="120">
  <defs>
    <linearGradient id="shieldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#1a237e;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#0d47a1;stop-opacity:1" />
    </linearGradient>
    <linearGradient id="bugGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#f57f17;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#c62828;stop-opacity:1" />
    </linearGradient>
    <linearGradient id="badgeGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#2e7d32;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#1b5e20;stop-opacity:1" />
    </linearGradient>
    <filter id="shadow" x="-10%" y="-10%" width="130%" height="140%">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#1a237e" flood-opacity="0.3"/>
    </filter>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="2" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <!-- Background -->
  <rect width="400" height="120" rx="12" ry="12" fill="#f5f5f5"/>

  <!-- Shield icon -->
  <g filter="url(#shadow)">
    <path d="M50 20 L50 70 Q50 90 80 95 Q110 90 110 70 L110 20 Z" fill="url(#shieldGrad)" stroke="#1a237e" stroke-width="1.5"/>
    <!-- Shield checkmark -->
    <path d="M65 58 L75 68 L95 48" fill="none" stroke="#ffffff" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/>
  </g>

  <!-- Bug icon inside shield area -->
  <g transform="translate(80, 55)" filter="url(#glow)">
    <!-- Bug body -->
    <ellipse cx="0" cy="0" rx="10" ry="7" fill="url(#bugGrad)" opacity="0.9"/>
    <!-- Bug head -->
    <circle cx="-10" cy="0" r="4" fill="#c62828"/>
    <!-- Bug eyes -->
    <circle cx="-12" cy="-2" r="1.5" fill="#ffffff"/>
    <circle cx="-8" cy="-2" r="1.5" fill="#ffffff"/>
    <!-- Bug legs -->
    <line x1="-5" y1="-7" x2="-8" y2="-12" stroke="#c62828" stroke-width="1.2" stroke-linecap="round"/>
    <line x1="0" y1="-7" x2="0" y2="-13" stroke="#c62828" stroke-width="1.2" stroke-linecap="round"/>
    <line x1="5" y1="-7" x2="8" y2="-12" stroke="#c62828" stroke-width="1.2" stroke-linecap="round"/>
    <line x1="-5" y1="7" x2="-8" y2="12" stroke="#c62828" stroke-width="1.2" stroke-linecap="round"/>
    <line x1="0" y1="7" x2="0" y2="13" stroke="#c62828" stroke-width="1.2" stroke-linecap="round"/>
    <line x1="5" y1="7" x2="8" y2="12" stroke="#c62828" stroke-width="1.2" stroke-linecap="round"/>
    <!-- Antennae -->
    <path d="M-12 -3 Q-16 -10 -14 -14" fill="none" stroke="#c62828" stroke-width="1" stroke-linecap="round"/>
    <path d="M-10 -4 Q-12 -12 -9 -15" fill="none" stroke="#c62828" stroke-width="1" stroke-linecap="round"/>
  </g>

  <!-- Title text -->
  <text x="130" y="45" font-family="Inter, 'Segoe UI', Arial, sans-serif" font-size="18" font-weight="700" fill="#1a237e" letter-spacing="0.5">Bug Bounty Program</text>

  <!-- Subtitle -->
  <text x="130" y="65" font-family="Roboto, 'Segoe UI', Arial, sans-serif" font-size="12" fill="#37474f" opacity="0.8">HackerOne / Bugcrowd Integration</text>

  <!-- Status badges -->
  <g transform="translate(130, 78)">
    <!-- Active badge -->
    <rect x="0" y="0" width="70" height="22" rx="11" ry="11" fill="url(#badgeGrad)"/>
    <circle cx="14" cy="11" r="4" fill="#ffffff" opacity="0.9"/>
    <text x="22" y="15" font-family="JetBrains Mono, 'Courier New', monospace" font-size="10" font-weight="600" fill="#ffffff">ACTIVE</text>

    <!-- Level badge -->
    <rect x="80" y="0" width="95" height="22" rx="11" ry="11" fill="#37474f"/>
    <text x="127" y="15" font-family="JetBrains Mono, 'Courier New', monospace" font-size="10" font-weight="600" fill="#ffffff" text-anchor="middle">ASVS L3</text>
  </g>

  <!-- Decorative line -->
  <line x1="130" y1="108" x2="380" y2="108" stroke="#1a237e" stroke-width="1" opacity="0.15"/>

  <!-- Version text -->
  <text x="380" y="115" font-family="JetBrains Mono, 'Courier New', monospace" font-size="8" fill="#37474f" opacity="0.4" text-anchor="end">v1.0.0</text>
</svg>
# compliance/bug_bounty_config.yaml
# Bug Bounty Program Configuration
# Owner: service:compliance
# Dependencies: §10.4 application security practices, §11.2 CI/CD pipeline, §16.3 Phase 3
# Blocks: §16.3 Phase 3 public marketplace launch
# Maturity Target: compounding_capital

---
apiVersion: v1
kind: BugBountyConfig
metadata:
  name: bug-bounty-program
  namespace: compliance
  labels:
    service: compliance
    phase: "3"
    maturity: compounding_capital
    security-layer: application
  annotations:
    description: "Bug bounty program configuration for public marketplace launch"
    spec-reference: "§10.4"
    blueprint-section: "§XIV Compounding Moat"
    acceptance-criteria: |
      - Bug bounty program registered on HackerOne or Bugcrowd
      - Responsible disclosure policy published at security.getbankable.io
      - Scope defined: in-scope services, out-of-scope systems, severity tiers and payout ranges
      - Triage workflow documented: receipt acknowledgement within 24h, severity classification within 72h
      - Internal triage team assigned with SLA for critical/high findings
      - Program soft-launched in private invite mode before Phase 3 public launch
      - Integration with existing security practices: findings tracked alongside ZAP DAST, pen test, and SAST results
      - Legal safe harbor language reviewed by counsel

spec:
  # Platform Selection
  platform:
    provider: HackerOne  # Options: HackerOne, Bugcrowd
    program_type: private_invite  # private_invite -> public during Phase 3 launch
    program_name: "GetBankable Security Bug Bounty"
    program_url: "https://hackerone.com/getbankable"
    launch_phase: "3"
    soft_launch_date: "2026-07-01"  # Target: 2 months before Phase 3 public launch
    public_launch_date: "2026-09-01"  # Phase 3 public marketplace launch

  # Responsible Disclosure Policy
  disclosure_policy:
    url: "https://security.getbankable.io/.well-known/security.txt"
    published: true
    last_reviewed: "2026-06-01"
    reviewed_by: "service:legal"
    safe_harbor:
      reviewed_by_counsel: true
      review_date: "2026-05-15"
      legal_contact: "security@getbankable.io"
    policy_document: "docs/security/responsible-disclosure-policy.md"

  # Scope Definitions
  scope:
    in_scope:
      services:
        - name: "GetBankable Web Application"
          domain: "app.getbankable.io"
          type: web_application
          severity_tiers: [critical, high, medium, low]
        - name: "GetBankable API"
          domain: "api.getbankable.io"
          type: api
          severity_tiers: [critical, high, medium, low]
        - name: "GetBankable Mobile API"
          domain: "mobile-api.getbankable.io"
          type: api
          severity_tiers: [critical, high, medium]
        - name: "GetBankable Marketplace"
          domain: "marketplace.getbankable.io"
          type: web_application
          severity_tiers: [critical, high, medium, low]
          launch_gate: true  # Blocks Phase 3 public launch
      assets:
        - type: source_code
          repositories:
            - "github.com/getbankable/web-app"
            - "github.com/getbankable/api-gateway"
            - "github.com/getbankable/marketplace"
        - type: docker_images
          registries:
            - "ghcr.io/getbankable/*"
    out_of_scope:
      systems:
        - name: "Internal Admin Panel"
          reason: "Internal tool with restricted access"
        - name: "Legacy API v1"
          reason: "Deprecated, scheduled for decommission"
        - name: "Third-party integrations"
          reason: "Managed by respective vendors"
      activities:
        - "Social engineering attacks"
        - "Physical security attacks"
        - "Denial of service attacks"
        - "Spamming"
        - "Automated scanning without prior approval"

  # Severity Tiers and Payout Ranges
  severity_tiers:
    critical:
      description: "Remote code execution, SQL injection with data extraction, authentication bypass"
      payout_range:
        min: 5000
        max: 15000
        currency: USD
      response_time: 4  # hours
      remediation_time: 48  # hours
    high:
      description: "Cross-site scripting (stored), IDOR with sensitive data, privilege escalation"
      payout_range:
        min: 2000
        max: 5000
        currency: USD
      response_time: 8  # hours
      remediation_time: 72  # hours
    medium:
      description: "Cross-site scripting (reflected), CSRF, information disclosure"
      payout_range:
        min: 500
        max: 2000
        currency: USD
      response_time: 24  # hours
      remediation_time: 168  # hours (7 days)
    low:
      description: "Minor information disclosure, missing security headers, best practice violations"
      payout_range:
        min: 100
        max: 500
        currency: USD
      response_time: 48  # hours
      remediation_time: 336  # hours (14 days)
    informational:
      description: "Non-security issues, documentation improvements"
      payout_range:
        min: 0
        max: 0
        currency: USD
      response_time: 72  # hours
      remediation_time: null

  # Triage Workflow SLAs
  triage:
    workflow:
      receipt_acknowledgement:
        sla: 24  # hours
        channel: email
        template: "Thank you for your submission. We have received your report and will begin triage."
      severity_classification:
        sla: 72  # hours
        process: |
          1. Initial review by triage team
          2. Reproduce the issue in staging environment
          3. Classify severity based on CVSS v3.1 scoring
          4. Assign to appropriate remediation team
      initial_response:
        critical: 4  # hours
        high: 8  # hours
        medium: 24  # hours
        low: 48  # hours
      remediation:
        critical: 48  # hours
        high: 72  # hours
        medium: 168  # hours (7 days)
        low: 336  # hours (14 days)
      disclosure_coordination:
        policy: "90-day disclosure timeline from remediation"
        exceptions: "Critical vulnerabilities may require extended coordination"

    # Internal Triage Team
    team:
      primary:
        - role: "Security Engineer"
          count: 2
          on_call: true
          rotation: "weekly"
        - role: "Application Security Lead"
          count: 1
          on_call: true
          escalation: true
      secondary:
        - role: "DevOps Engineer"
          count: 1
          on_call: false
        - role: "Legal Counsel"
          count: 1
          on_call: false
      escalation:
        - role: "CISO"
          count: 1
          on_call: true
          trigger: "Critical severity or unresolved high severity after 24h"

  # Integration with Existing Security Practices
  integrations:
    zap_dast:
      enabled: true
      findings_tracking: true
      deduplication: true
      notes: "Bug bounty findings cross-referenced with ZAP DAST results"
    penetration_testing:
      enabled: true
      findings_tracking: true
      deduplication: true
      notes: "Annual pen test findings used for scope validation"
    sast:
      enabled: true
      findings_tracking: true
      deduplication: true
      tools:
        - semgrep
        - codeql
      notes: "SAST findings used to identify potential vulnerability patterns"
    ci_cd_pipeline:
      enabled: true
      pipeline_reference: "§11.2 CI/CD pipeline"
      integration_points:
        - stage: "security_scan"
          action: "Cross-reference bug bounty findings with automated scans"
        - stage: "deploy"
          action: "Block deployment if critical bug bounty finding unresolved"

  # Phase Gates
  phase_gates:
    phase_2_preparation:
      - task: "Register program on HackerOne or Bugcrowd"
        deadline: "2026-06-15"
        owner: "service:compliance"
      - task: "Publish responsible disclosure policy"
        deadline: "2026-06-01"
        owner: "service:security"
      - task: "Legal review of safe harbor language"
        deadline: "2026-05-15"
        owner: "service:legal"
      - task: "Define scope and severity tiers"
        deadline: "2026-05-01"
        owner: "service:security"
      - task: "Assign internal triage team"
        deadline: "2026-06-01"
        owner: "service:engineering"
      - task: "Document triage workflow"
        deadline: "2026-06-15"
        owner: "service:security"
      - task: "Configure integration with existing security tools"
        deadline: "2026-06-20"
        owner: "service:devops"
    phase_3_launch:
      - task: "Transition program from private to public"
        deadline: "2026-09-01"
        owner: "service:compliance"
      - task: "Verify all acceptance criteria met"
        deadline: "2026-08-15"
        owner: "service:security"
      - task: "Final legal review of disclosure policy"
        deadline: "2026-08-20"
        owner: "service:legal"
      - task: "Conduct dry-run triage exercise"
        deadline: "2026-08-01"
        owner: "service:security"

  # Validation Rules
  validation:
    required_fields:
      - "spec.platform.provider"
      - "spec.platform.program_type"
      - "spec.disclosure_policy.url"
      - "spec.disclosure_policy.safe_harbor.reviewed_by_counsel"
      - "spec.scope.in_scope.services"
      - "spec.severity_tiers.critical.payout_range.min"
      - "spec.triage.workflow.receipt_acknowledgement.sla"
      - "spec.triage.team.primary"
    constraints:
      payout_minimums:
        critical: 5000
        high: 2000
        medium: 500
        low: 100
      sla_maximums:
        receipt_acknowledgement: 24
        severity_classification: 72
        critical_response: 4
        high_response: 8
      team_minimums:
        primary_security_engineers: 2
        primary_appsec_leads: 1
    cross_references:
      - field: "spec.integrations.ci_cd_pipeline.pipeline_reference"
        expected: "§11.2 CI/CD pipeline"
      - field: "metadata.annotations.spec-reference"
        expected: "§10.4"
      - field: "metadata.annotations.blueprint-section"
        expected: "§XIV Compounding Moat"

  # Monitoring and Alerting
  monitoring:
    metrics:
      - name: "time_to_triage"
        description: "Time from submission to initial triage"
        target: "< 24 hours"
        alert_threshold: "> 48 hours"
      - name: "time_to_classification"
        description: "Time from submission to severity classification"
        target: "< 72 hours"
        alert_threshold: "> 96 hours"
      - name: "critical_response_time"
        description: "Time to respond to critical findings"
        target: "< 4 hours"
        alert_threshold: "> 8 hours"
      - name: "remediation_time"
        description: "Time to remediate critical findings"
        target: "< 48 hours"
        alert_threshold: "> 72 hours"
    alerts:
      channels:
        - slack: "#security-alerts"
        - email: "security-team@getbankable.io"
        - pagerduty: "security-on-call"
      escalation:
        - level: 1
          notify: "Security Engineer on-call"
          delay: 0
        - level: 2
          notify: "Application Security Lead"
          delay: 30  # minutes
        - level: 3
          notify: "CISO"
          delay: 60  # minutes

  # Compliance and Audit
  compliance:
    standards:
      - name: "SOC 2"
        control: "CC6.1"
        mapping: "Vulnerability management program"
      - name: "ISO 27001"
        control: "A.12.6.1"
        mapping: "Vulnerability management"
      - name: "PCI DSS"
        control: "6.5"
        mapping: "Secure coding and vulnerability management"
    audit_trail:
      enabled: true
      retention_days: 365
      events:
        - "Program configuration changes"
        - "Scope modifications"
        - "Payout adjustments"
        - "Team membership changes"
        - "SLA breaches"
    reporting:
      frequency: "weekly"
      distribution:
        - "CISO"
        - "VP Engineering"
        - "Compliance Officer"
      metrics:
        - "Total submissions"
        - "Open vs closed findings"
        - "Average time to triage"
        - "Average time to remediation"
        - "Payout totals"
        - "SLA compliance rate"